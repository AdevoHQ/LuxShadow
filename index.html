<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxShadow</title>
  <h1>LuxShadow</h1>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #0f0f11;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .preview-container {
      width: 100%;
      max-width: 320px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #141417;
      border-radius: 10px;
      border: 1px solid #222228;
      margin-bottom: 30px;
    }
    .preview-box {
      width: 120px;
      height: 120px;
      background: #1a1a1e;
      border-radius: 12px;
      transition: box-shadow 0.05s ease, border-radius 0.05s ease;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }
    .color-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .code-output {
      margin-top: 24px;
      background: #16161a;
      padding: 12px 16px;
      border-radius: 6px;
      border: 1px solid #2a2a30;
      font-size: 12px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease;
    }
    .code-output:hover {
      border-color: #444450;
    }
  </style>
</head>
<body>

  <div class="preview-container">
    <div class="preview-box" id="box"></div>
  </div>

  <div class="controls">
    <div class="control-row">
      <label>Axis X: <span id="valX">0</span>px</label>
    </div>
    <input type="range" id="x" min="-50" max="50" value="0">

    <div class="control-row">
      <label>Axis Y: <span id="valY">10</span>px</label>
    </div>
    <input type="range" id="y" min="-50" max="50" value="10">

    <div class="control-row">
      <label>Blur: <span id="valBlur">20</span>px</label>
    </div>
    <input type="range" id="blur" min="0" max="100" value="20">

    <div class="control-row">
      <label>Expansión (<span translate="no">Spread</span>): <span id="valSpread">0</span>px</label>      
    </div>
    <input type="range" id="spread" min="-20" max="50" value="0">

    <div class="control-row">
      <label>Opacity: <span id="valOpacity">50</span>%</label>
    </div>
    <input type="range" id="opacity" min="0" max="100" value="50">

    <div class="control-row">
      <label>Borders (<span translate="no">Radius</span>): <span id="valRadius">12</span>px</label>                                                          
    </div>
    <input type="range" id="radius" min="0" max="60" value="12">

    <div class="control-row color-row">
      <label for="color">Shadow Color:</label>
      <input type="color" id="color" value="#000000">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="inset"> Inset Shadow
    </label>
  </div>

  <div class="code-output" id="code" title="Clic para copiar">
    box-shadow: 0px 10px 20px 0px rgba(0, 0, 0, 0.5);
  </div>

  <script>
    const box = document.getElementById('box');
    const code = document.getElementById('code');
    const colorInput = document.getElementById('color');
    const insetInput = document.getElementById('inset');

    const rangeInputs = ['x', 'y', 'blur', 'spread', 'opacity', 'radius'].reduce((acc, id) => {
      acc[id] = document.getElementById(id);
      return acc;
    }, {});

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function update() {
      const x = rangeInputs.x.value;
      const y = rangeInputs.y.value;
      const blur = rangeInputs.blur.value;
      const spread = rangeInputs.spread.value;
      const opacity = rangeInputs.opacity.value / 100;
      const radius = rangeInputs.radius.value;
      const isInset = insetInput.checked ? 'inset ' : '';

      document.getElementById('valX').textContent = x;
      document.getElementById('valY').textContent = y;
      document.getElementById('valBlur').textContent = blur;
      document.getElementById('valSpread').textContent = spread;
      document.getElementById('valOpacity').textContent = rangeInputs.opacity.value;
      document.getElementById('valRadius').textContent = radius;

      const rgba = hexToRgba(colorInput.value, opacity);
      const shadow = `${isInset}${x}px ${y}px ${blur}px ${spread}px ${rgba}`;

      box.style.borderRadius = `${radius}px`;
      box.style.boxShadow = shadow;
      code.textContent = `box-shadow: ${shadow};`;
    }

    Object.values(rangeInputs).forEach(input => input.addEventListener('input', update));
    colorInput.addEventListener('input', update);
    insetInput.addEventListener('change', update);

    update();

    code.addEventListener('click', () => {
      navigator.clipboard.writeText(code.textContent);
      const original = code.textContent;
      code.textContent = '¡Copiado al portapapeles!';
      setTimeout(() => code.textContent = original, 1200);
    });
  </script>
</body>
</html>
